plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.joapetis.bitcoinfuturos'
    compileSdk 35
    defaultConfig {
        applicationId 'com.joapetis.bitcoinfuturos'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.11'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
