plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.joapetis.bitcoinfuturos'
    compileSdk 35
    defaultConfig {
        applicationId 'com.joapetis.bitcoinfuturos'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '5.1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
