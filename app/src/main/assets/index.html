<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1118"><title>Futuros cripto · Multibot</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#121c27;--line:#273647;--txt:#eaf1f8;--muted:#9caec0;--accent:#f0b90b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:10px 12px 8px;background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0}
.title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.title strong{font-size:16px}.title small{color:var(--muted);font-size:11px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:3px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 11px;font-size:12px;font-weight:650;min-height:40px}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#111820}
#workspace{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.active{display:block}
footer{flex-shrink:0;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:10px;color:var(--muted);text-align:center}
</style></head><body>
<header><div class="title"><strong>Futuros cripto · Multibot</strong><small>Simulación independiente por activo</small></div><nav class="tabs" id="tabs" role="tablist" aria-label="Criptomonedas"></nav></header>
<main id="workspace"></main><footer>Simulación educativa · Cada pestaña tiene saldo y operaciones independientes. No se envían órdenes reales.</footer>
<script>
(function(){
const assets=[['BTCUSDT','BTC'],['ETHUSDT','ETH'],['SOLUSDT','SOL'],['XRPUSDT','XRP'],['DOGEUSDT','DOGE'],['BNBUSDT','BNB'],['LINKUSDT','LINK'],['ADAUSDT','ADA'],['AVAXUSDT','AVAX'],['SUIUSDT','SUI']];
const nav=document.getElementById('tabs'),space=document.getElementById('workspace');let active='BTCUSDT';
assets.forEach(([symbol,label],i)=>{const b=document.createElement('button');b.type='button';b.role='tab';b.textContent=label;b.setAttribute('aria-selected',String(i===0));b.addEventListener('click',()=>select(symbol));nav.appendChild(b);
const f=document.createElement('iframe');f.title='Bot '+label;f.loading='eager';f.dataset.symbol=symbol;f.src='bot.html?symbol='+encodeURIComponent(symbol);if(i===0)f.classList.add('active');space.appendChild(f);});
function select(symbol){active=symbol;[...nav.children].forEach((b,i)=>b.setAttribute('aria-selected',String(assets[i][0]===symbol)));[...space.children].forEach(f=>f.classList.toggle('active',f.dataset.symbol===symbol));const b=[...nav.children].find((x,i)=>assets[i][0]===symbol);if(b)b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
})();
</script></body></html>
